<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今天吃什么 · 抽签</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    background-color: #0b1120; /* 深夜蓝底色 */
    
    /* 背景图片设置：加上了幽蓝色的半透明罩子 */
    background-image: 
      linear-gradient(rgba(11, 17, 32, 0.7), rgba(11, 17, 32, 0.9)), 
      url('jiangyan.jpg'); /* 你的照片名字 */
    
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e2e8f0; /* 冷白文字 */
    overflow-x: hidden;
  }
  
  .app {
    --stage-h: 440px; --stick-w: 84px; --stick-h: 290px; --stick-bottom: 110px;
    --tube-w: 160px; --tube-h: 270px; --body-h: 185px; --mouth-h: 40px;
    width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; user-select: none;
  }
  .header { text-align: center; margin-bottom: 6px; }
  
  /* 标题改为冰蓝色渐变 */
  h1 {
    margin: 0 0 10px; font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 30px; font-weight: 700; letter-spacing: 7px; text-indent: 7px;
    background: linear-gradient(180deg, #e0f2fe 5%, #7dd3fc 55%, #2563eb 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(56, 189, 248, .3));
  }
  .sub { margin: 0; font-size: 13px; letter-spacing: 3px; text-indent: 3px; color: rgba(186, 230, 253, .6); }
  .stage { position: relative; width: 100%; height: var(--stage-h); overflow: hidden; margin-top: 4px; }
  
  /* 签筒改为深蓝色调 */
  .tube {
    position: absolute; left: 50%; bottom: 0; width: var(--tube-w); height: var(--tube-h);
    transform: translateX(-50%); transform-origin: 50% 100%; z-index: 2; transition: opacity .45s ease, transform .45s ease;
  }
  .tube.dim { opacity: .28; transform: translateX(-50%) scale(.9); }
  .tube.shake { animation: tube-shake .75s ease-in-out; }
  @keyframes tube-shake {
    0% { transform: translateX(-50%) rotate(0deg); }
    12% { transform: translateX(-50%) rotate(-7deg) translateY(-3px); }
    27% { transform: translateX(-50%) rotate(6deg) translateY(2px); }
    43% { transform: translateX(-50%) rotate(-5deg) translateY(-2px); }
    58% { transform: translateX(-50%) rotate(4deg); }
    74% { transform: translateX(-50%) rotate(-2.5deg); }
    88% { transform: translateX(-50%) rotate(1.5deg); }
    100% { transform: translateX(-50%) rotate(0deg); }
  }
  .tube-sticks {
    position: absolute; left: 50%; bottom: calc(var(--body-h) - var(--mouth-h) + 6px);
    width: 120px; height: 10px; transform: translateX(-50%); z-index: 1;
  }
  
  /* 里面的签条改为冰晶蓝 */
  .stick-deco {
    position: absolute; bottom: 0; left: 50%; width: 10px; border-radius: 5px 5px 2px 2px;
    background: linear-gradient(180deg, #e0f2fe 0%, #93c5fd 45%, #3b82f6 100%);
    box-shadow: 0 2px 5px rgba(0, 0, 0, .5), inset -1px 0 0 rgba(255, 255, 255, .6);
    transform-origin: bottom center;
  }
  
  /* 筒身改为深邃的海蓝/墨蓝 */
  .tube-body {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--body-h); border-radius: 8px 8px 22px 22px;
    background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .15) 0 1.5px, transparent 1.5px 16px),
                linear-gradient(180deg, #1e3a8a 0%, #172554 42%, #0f172a 100%);
    box-shadow: inset 0 -18px 30px rgba(0, 0, 0, .65), inset 0 2px 0 rgba(147, 197, 253, .2), 0 16px 34px rgba(0, 0, 0, .65);
  }
  
  /* 筒口 */
  .tube-mouth {
    position: absolute; left: -5px; right: -5px; bottom: calc(var(--body-h) - var(--mouth-h)); height: var(--mouth-h);
    border-radius: 50%; background: radial-gradient(ellipse at 50% 42%, #020617 0%, #0f172a 70%);
    box-shadow: inset 0 8px 14px rgba(0, 0, 0, .98), 0 0 0 2px #1d4ed8, 0 0 0 3px rgba(147, 197, 253, .15); z-index: 3;
  }
  
  /* 飞出的签 */
  .stick {
    position: absolute; left: 50%; bottom: var(--stick-bottom); width: var(--stick-w); height: var(--stick-h);
    transform: translate(-50%, 45%) scale(.42); transform-origin: center bottom; opacity: 0; z-index: 5;
    transition: transform 1.05s cubic-bezier(.16, 1, .3, 1), opacity .45s ease; pointer-events: none;
  }
  .stick.quick { transition: transform .38s ease-in, opacity .28s ease-in; }
  .stick.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
  
  /* 签面改为冷月白/冰蓝渐变 */
  .stick-face {
    position: relative; width: 100%; height: 100%; border-radius: 9px 9px 5px 5px;
    background: linear-gradient(158deg, #f8fafc 0%, #e0f2fe 42%, #bae6fd 78%, #7dd3fc 100%);
    box-shadow: 0 0 0 2px #2563eb, 0 0 0 3.5px rgba(30, 64, 175, .5), 0 22px 46px rgba(0, 0, 0, .6), inset 0 0 34px rgba(56, 189, 248, .3);
    display: flex; align-items: center; justify-content: center; padding: 54px 8px 26px; overflow: hidden;
  }
  .stick-face::after {
    content: ''; position: absolute; inset: -20%;
    background: linear-gradient(112deg, transparent 34%, rgba(255, 255, 255, .9) 47%, rgba(255, 255, 255, .4) 53%, transparent 64%);
    transform: translateX(-130%); pointer-events: none;
  }
  .stick.show .stick-face::after { animation: shine 1.3s .85s ease forwards; }
  @keyframes shine { to { transform: translateX(130%); } }
  
  /* 印章改为青玉/深蓝色 */
  .seal {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%) rotate(-3deg); width: 30px; height: 30px; border-radius: 5px;
    background: linear-gradient(180deg, #3b82f6, #1d4ed8); color: #eff6ff;
    font-family: "Songti SC", "STSong", serif; font-size: 16px; line-height: 1; display: grid; place-items: center;
    box-shadow: 0 3px 8px rgba(29, 78, 216, .5), inset 0 1px 0 rgba(255, 255, 255, .4); z-index: 2;
  }
  
  /* 签文改为深蓝色 */
  .stick-text {
    writing-mode: vertical-rl; text-orientation: upright; font-family: "Songti SC", "STSong", "SimSun", serif;
    font-weight: 700; font-size: 32px; letter-spacing: 5px; line-height: 1.15; color: #1e3a8a; max-height: 100%;
    overflow: hidden; text-shadow: 0 1px 0 rgba(255, 255, 255, .8); transition: font-size .2s; position: relative; z-index: 1;
  }
  
  .actions { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 14px; width: 100%; }
  
  /* 抽签按钮改为亮蓝色 */
  .btn-draw {
    min-width: 220px; padding: 16px 36px; border: none; border-radius: 999px; font-family: inherit; font-size: 19px; font-weight: 700;
    letter-spacing: 6px; text-indent: 6px; color: #0f172a; cursor: pointer;
    background: linear-gradient(180deg, #bae6fd 0%, #60a5fa 42%, #3b82f6 100%);
    box-shadow: 0 10px 26px rgba(59, 130, 246, .4), 0 2px 0 rgba(255, 255, 255, .5) inset, 0 -3px 0 rgba(29, 78, 216, .4) inset;
    transition: transform .12s ease, box-shadow .25s ease, opacity .25s ease;
  }
  .btn-draw:hover:not(:disabled) { box-shadow: 0 14px 34px rgba(59, 130, 246, .55), 0 2px 0 rgba(255, 255, 255, .5) inset, 0 -3px 0 rgba(29, 78, 216, .4) inset; }
  .btn-draw:active:not(:disabled) { transform: translateY(2px) scale(.985); }
  .btn-draw:disabled { opacity: .45; cursor: not-allowed; }
  
  .btn-ghost {
    padding: 9px 22px; border-radius: 999px; border: 1px solid rgba(96, 165, 250, .3); background: rgba(15, 23, 42, .5);
    color: rgba(186, 230, 253, .7); font-family: inherit; font-size: 13px; letter-spacing: 2px; text-indent: 2px; cursor: pointer; transition: all .2s;
  }
  .btn-ghost:hover { border-color: rgba(96, 165, 250, .6); color: #e0f2fe; background: rgba(30, 58, 138, .4); }
  
  .modal {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(2, 6, 23, .8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: 100%; max-width: 380px; padding: 24px 22px 20px; border-radius: 20px; background: linear-gradient(180deg, #1e293b, #0f172a);
    border: 1px solid rgba(96, 165, 250, .25); box-shadow: 0 30px 70px rgba(0, 0, 0, .8);
    transform: scale(.93) translateY(12px); transition: transform .32s cubic-bezier(.16, 1, .3, 1);
  }
  .modal.open .modal-card { transform: scale(1) translateY(0); }
  .modal-card h2 { margin: 0 0 6px; font-family: "Songti SC", "STSong", serif; font-size: 20px; letter-spacing: 3px; color: #bae6fd; }
  .hint { margin: 0 0 14px; font-size: 12.5px; letter-spacing: 1px; color: rgba(186, 230, 253, .5); }
  
  textarea {
    width: 100%; height: 210px; padding: 13px 14px; border-radius: 13px; border: 1px solid rgba(96, 165, 250, .2);
    background: #0b1120; color: #e0f2fe; font-family: inherit; font-size: 15px; line-height: 1.9; resize: none; outline: none; transition: border-color .2s;
  }
  textarea:focus { border-color: rgba(96, 165, 250, .6); }
  
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal-actions .btn-draw.small { min-width: 0; padding: 10px 26px; font-size: 15px; letter-spacing: 3px; text-indent: 3px; }
  .modal-actions .btn-ghost { padding: 10px 22px; font-size: 14px; }
  
  @media (max-height: 730px), (max-width: 380px) {
    .app { --stage-h: 372px; --stick-w: 72px; --stick-h: 242px; --stick-bottom: 84px; --tube-w: 138px; --tube-h: 232px; --body-h: 158px; --mouth-h: 34px; }
    h1 { font-size: 25px; letter-spacing: 5px; text-indent: 5px; }
    .sub { font-size: 12px; }
    .btn-draw { padding: 14px 30px; font-size: 17px; min-width: 190px; }
    .stick-text { font-size: 26px; }
    .seal { width: 26px; height: 26px; font-size: 14px; top: 13px; }
    .stick-face { padding-top: 46px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>今天吃什么</h1>
    <p class="sub">摇一摇签筒 · 让缘分决定</p>
  </div>
  <div class="stage" id="stage">
    <div class="stick" id="stick">
      <div class="stick-face">
        <div class="seal">签</div>
        <div class="stick-text" id="stickText"></div>
      </div>
    </div>
    <div class="tube" id="tube">
      <div class="tube-sticks" id="tubeSticks"></div>
      <div class="tube-body"></div>
      <div class="tube-mouth"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn-draw" id="drawBtn">抽签</button>
    <button class="btn-ghost" id="editBtn">菜品设置</button>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-card">
    <h2>菜品设置</h2>
    <p class="hint">每行写一个菜品，至少 2 个哦</p>
    <textarea id="dishInput" spellcheck="false" placeholder="麻辣烫&#10;兰州拉面&#10;火锅"></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-draw small" id="saveBtn">保存</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  const DEFAULT_DISHES = [
    '麻辣烫', '兰州拉面', '黄焖鸡米饭', '沙县小吃', '日式咖喱',
    '汉堡薯条', '披萨', '寿司', '火锅', '烧烤',
    '酸菜鱼', '螺蛳粉', '蛋炒饭', '饺子', '牛肉面',
    '麻辣香锅', '炸鸡', '沙拉', '肠粉', '小笼包',
    '石锅拌饭', '意大利面', '三明治', '盖浇饭', '烤鱼'
  ];
  const STORAGE_KEY = 'eat-what-today-dishes';
  const stage = document.getElementById('stage');
  const tube = document.getElementById('tube');
  const tubeSticks = document.getElementById('tubeSticks');
  const stick = document.getElementById('stick');
  const stickText = document.getElementById('stickText');
  const drawBtn = document.getElementById('drawBtn');
  const editBtn = document.getElementById('editBtn');
  const modal = document.getElementById('modal');
  const dishInput = document.getElementById('dishInput');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  let dishes = loadDishes();
  let lastResult = null;
  let drawing = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function loadDishes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length >= 2) {
          return arr.filter((s) => typeof s === 'string' && s.trim()).map((s) => s.trim());
        }
      }
    } catch (e) { }
    return DEFAULT_DISHES.slice();
  }
  function saveDishes(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) { }
  }
  function buildDecoSticks() {
    tubeSticks.innerHTML = '';
    const count = 5;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('i');
      el.className = 'stick-deco';
      const offset = (i - (count - 1) / 2) * 17 + (Math.random() * 8 - 4);
      const rotate = (i - (count - 1) / 2) * 4.2 + (Math.random() * 5 - 2.5);
      const height = 76 + Math.random() * 36;
      el.style.height = height.toFixed(1) + 'px';
      el.style.transform = 'translateX(calc(-50% + ' + offset.toFixed(1) + 'px)) rotate(' + rotate.toFixed(1) + 'deg)';
      el.style.opacity = (0.85 + Math.random() * 0.15).toFixed(2);
      tubeSticks.appendChild(el);
    }
  }
  function pickDish() {
    let pool = dishes;
    if (dishes.length > 1 && lastResult) {
      const filtered = dishes.filter((d) => d !== lastResult);
      if (filtered.length) pool = filtered;
    }
    const result = pool[Math.floor(Math.random() * pool.length)];
    lastResult = result;
    return result;
  }
  async function draw() {
    if (drawing) return;
    drawing = true;
    drawBtn.disabled = true;
    if (stick.classList.contains('show')) {
      stick.classList.add('quick');
      stick.classList.remove('show');
      tube.classList.remove('dim');
      await sleep(430);
      stick.classList.remove('quick');
    }
    tube.classList.add('shake');
    await sleep(750);
    tube.classList.remove('shake');
    const result = pickDish();
    stickText.textContent = result;
    const len = result.length;
    stickText.style.fontSize = len <= 3 ? '34px' : len <= 5 ? '26px' : '21px';
    stick.classList.remove('show');
    void stick.offsetWidth;
    tube.classList.add('dim');
    stick.classList.add('show');
    await sleep(1200);
    drawing = false;
    drawBtn.disabled = false;
    drawBtn.textContent = '再抽一次';
  }
  drawBtn.addEventListener('click', draw);
  editBtn.addEventListener('click', () => {
    dishInput.value = dishes.join('\n');
    modal.classList.add('open');
    setTimeout(() => dishInput.focus(), 250);
  });
  cancelBtn.addEventListener('click', () => { modal.classList.remove('open'); });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
  saveBtn.addEventListener('click', () => {
    const lines = dishInput.value.split('\n').map((s) => s.trim()).filter(Boolean);
    const unique = Array.from(new Set(lines));
    if (unique.length < 2) { alert('至少要有 2 个菜品哦～'); return; }
    dishes = unique;
    saveDishes(dishes);
    lastResult = null;
    modal.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (e.code === 'Space' && !modal.classList.contains('open') && tag !== 'TEXTAREA' && tag !== 'INPUT') {
      e.preventDefault(); draw();
    }
    if (e.key === 'Escape') modal.classList.remove('open');
  });
  buildDecoSticks();
})();
</script>
</body>
</html>
